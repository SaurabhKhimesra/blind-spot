name: checks

# The study is pure numpy: it locks every number in the README and needs no
# ROS installation, so it runs here on every push. The guard itself is C++ and
# its two suites run under colcon test, on the distro they target.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the study
        run: pip install ./src/blindspot
      - name: Regression checks (170)
        run: python -m blindspot.checks.regression
      - name: Finite-difference checks (16)
        run: python -m blindspot.checks.fd_check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: No unused imports or undefined names
        run: python -m pyflakes src/
