name: checks

# The three suites are pure numpy: they lock every number in the README and
# need no ROS installation. The ROS packages are built and tested separately,
# on the distro they target.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the guard library
        run: pip install ./src/blindspot
      - name: Regression checks (177)
        run: python -m blindspot.checks.regression
      - name: Finite-difference checks (16)
        run: python -m blindspot.checks.fd_check
      - name: API checks (34)
        run: python -m blindspot.checks.api

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: No unused imports or undefined names
        run: python -m pyflakes src/
