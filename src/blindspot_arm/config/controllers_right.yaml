/right/controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # fold_node drives this directly with trajectory_msgs/JointTrajectory.
    # velocity_controllers is not packaged on this distro, and the servo loop
    # already resolves its own joint command, so position control is enough.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/right/arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
